# Um bloco por projeto. Preencha os links reais (ou mande para o Claude preencher).
# caminho_local é relativo à pasta design-ops. Cada caminho_local também precisa
# estar em .claude/settings.json > additionalDirectories.

projetos:
  azo-web:
    nome: "Azo Telemedicina - Web"
    branch_base: "dev"                 # a main está desatualizada; Storybook e protótipos partem da dev
    repos:
      - url: "https://github.com/edgebr/AZO-Telemedicina-Web.git"
        branch: "dev"
        caminho_local: "../azo-telemedicina-web"
        papel: "produto + storybook"   # app Vite + React (npm); Storybook 10 na raiz
      - url: "https://github.com/edgebr/AZO-Telemedicina-API.git"
        branch: "dev"
        caminho_local: "../azo-telemedicina-api"
        papel: "openapi"               # só o openapi.yaml (gera o cliente src/api/generated via orval)
        sparse: "/openapi.yaml"
    storybook:
      instalar: "npm ci && npx orval --config ./orval.config.ts"   # na raiz do repositório web; precisa do .env
      env: "cp .env.example .env e OPENAPI_FILE_PATH=../azo-telemedicina-api/openapi.yaml"
      comando: "npm run storybook"
      url_local: "http://localhost:6006"
      pasta_stories: "src/**/*.stories.@(ts|tsx)"   # maioria em src/stories/ (~100 arquivos, 520 entradas)
      pasta_componentes: "src/components"           # primitivos em src/components/ui
      helper_figma: "src/stories/figma.ts"          # gestaoMasterDesign(nodeId) liga a story ao frame do Figma
    chromatic:
      app_id: "6abe8eaf8816f214c93e915e"
      biblioteca: "https://www.chromatic.com/library?appId=6abe8eaf8816f214c93e915e"
      testes: "https://www.chromatic.com/library?appId=6abe8eaf8816f214c93e915e&view=tests"
      storybook_publicado: "https://dev--6abe8eaf8816f214c93e915e.chromatic.com"   # padrão <branch>--<appId>
    figma:
      # Um arquivo por persona. A persona da tarefa vem da linha "Persona:" do us.md.
      # Os três têm a mesma estrutura de páginas; os agentes criam uma SEÇÃO
      # "<CHAVE> · <etapa>" dentro da página da etapa (não criam páginas novas).
      paginas:
        fluxo: "✍ ・ Wireframes"
        wireframe: "✍ ・ Wireframes"
        alta: "↳ Design de Alta"
        prototipo: "↳ Prototipo"
        handoff: "↳ Handoff"
        componentes: "🧩 ・ Componentes"
      personas:
        gestao:
          nome: "Gestão master (empresa / plataforma)"
          url: "https://www.figma.com/design/6qEOF9vHotXUIcTMww83EE/Azo-Benef%C3%ADcios---Gest%C3%A3o-master"
          file_key: "6qEOF9vHotXUIcTMww83EE"
          handoff_node: "4120:29870"
          obs: "também tem a página \"◆ ・ UI Projeto 2\" com \"↳ Handoff \" (4194:4004)"
        profissional:
          nome: "Profissionais de Saúde"
          url: "https://www.figma.com/design/7VDxmS4GB6B6rPDTHSRdyA/Azo-Benef%C3%ADcios---Profissionais-de-Sa%C3%BAde"
          file_key: "7VDxmS4GB6B6rPDTHSRdyA"
          handoff_node: "5709:12318"
        beneficiario:
          nome: "Beneficiários"
          url: "https://www.figma.com/design/NMRjtcGxTbYgZPSyv8KJbB/Azo-Benef%C3%ADcios---Benefici%C3%A1rios"
          file_key: "NMRjtcGxTbYgZPSyv8KJbB"
          handoff_node: "6438:1312"
          obs: "componentes também na página \"🧩 ・ Componentes · Padrão Azo\""
    jira:
      site: "https://edgebr.atlassian.net"
      cloud_id: "97f6dd8d-eaf8-4654-a786-9755c18ced2d"
      projeto: "AZOT"                  # Azo - Telemedicina
      board: "https://edgebr.atlassian.net/jira/software/c/projects/AZOT/boards"
      status_qa: "Quality Assurance"   # status para onde a task vai depois do design
      label_duvida_qa: "duvida-design" # label ainda não existe no AZOT; crie ao marcar a 1ª dúvida
      label_web: "WEB"
    prototipo:
      modo: "codigo"                   # "codigo" (worktree + Storybook) ou "figma"
