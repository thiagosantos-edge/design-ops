# Um bloco por projeto. Preencha os links reais (ou mande para o Claude preencher).
# caminho_local é relativo à pasta design-ops. Cada caminho_local também precisa
# estar em .claude/settings.json > additionalDirectories.

projetos:
  projeto-a:
    nome: "Nome do projeto"
    branch_base: "main"
    repos:
      - url: "https://github.com/ORG/REPO.git"
        caminho_local: "../repos/REPO"
        papel: "produto + storybook"      # se o Storybook for outro repo, adicione outro item
    storybook:
      comando: "npm run storybook"
      url_local: "http://localhost:6006"
      pasta_stories: "src/**/*.stories.tsx"
    chromatic_url: "https://www.chromatic.com/library?appId=XXXX"
    figma:
      arquivo_trabalho: "https://www.figma.com/design/XXXX/Projeto"   # onde os agentes criam páginas por tarefa
      biblioteca: "https://www.figma.com/design/YYYY/Design-System"   # componentes vinculados ao Storybook
    jira:
      site: "https://SUA-ORG.atlassian.net"
      projeto: "CHAVE"
      board: "https://SUA-ORG.atlassian.net/jira/software/projects/CHAVE/boards/1"
      status_qa: "QA"            # nome exato do status para onde a task vai no fim
      label_duvida_qa: "duvida-design"
    prototipo:
      modo: "codigo"             # "codigo" (worktree + Storybook) ou "figma"
